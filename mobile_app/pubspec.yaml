name: bitedash
description: "Bitedash - All food taste and price with lightspeed delivery in one place."
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.0.0
  flutter_dotenv: ^5.0.2
  flutter_map: ^7.0.0
  flutter_map_location_marker: ^9.1.1
  latlong2: ^0.9.0
  shared_preferences: ^2.0.15
  flutter_secure_storage: ^8.0.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  file_picker: ^8.3.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true